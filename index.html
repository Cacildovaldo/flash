<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Golden Token</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js" type="application/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .status-card {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .status-item { font-weight: bold; }
        .status-value { color: #2980b9; }
        .action-section {
            border-top: 2px solid #eee;
            padding-top: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label { margin-bottom: 5px; font-weight: 600; }
        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 16px;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #27ae60; color: white; }
        .btn-success:hover { background-color: #219150; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-connect { width: 100%; margin-bottom: 20px; background-color: #8e44ad; color: white; }
        .log {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Golden Token Admin</h1>
    
    <button id="connectBtn" class="btn-connect">Conectar Carteira</button>
    
    <div id="adminPanel" style="display:none;">
        <div class="status-card">
            <div class="status-item">Taxa Atual: <span id="valTaxa" class="status-value">...</span>%</div>
            <div class="status-item">Status Taxa: <span id="valStatus" class="status-value">...</span></div>
            <div class="status-item">Dono: <span id="valOwner" class="status-value" style="font-size: 0.8em;">...</span></div>
            <div class="status-item">Seu Saldo: <span id="valSaldo" class="status-value">...</span> GOLDEN</div>
        </div>

        <div class="action-section">
            <h3>Alterar Percentual da Taxa</h3>
            <div class="input-group">
                <label>Nova Taxa (0-100%):</label>
                <input type="number" id="inputTaxa" placeholder="Ex: 10" min="0" max="100">
            </div>
            <button onclick="updateTaxa()" class="btn-primary">Atualizar Taxa</button>
        </div>

        <div class="action-section">
            <h3>Status do Sistema</h3>
            <div class="input-group">
                <label>Ativar/Desativar Taxa:</label>
                <select id="selectStatus">
                    <option value="true">Ligada</option>
                    <option value="false">Desligada</option>
                </select>
            </div>
            <button onclick="updateStatus()" class="btn-success">Atualizar Status</button>
        </div>

        <div class="action-section">
            <h3>Autorizar Pool (DEX)</h3>
            <div class="input-group">
                <label>Endereço do Pool:</label>
                <input type="text" id="inputPool" placeholder="0x...">
            </div>
            <div class="input-group">
                <label>Ação:</label>
                <select id="selectPoolAction">
                    <option value="true">Autorizar (Sem Taxa)</option>
                    <option value="false">Remover Autorização</option>
                </select>
            </div>
            <button onclick="updatePool()" class="btn-primary">Atualizar Pool</button>
        </div>
        
        <div class="action-section">
            <h3>Gerenciamento de Tokens</h3>
            <div class="input-group">
                <label>Quantidade para Mint (Criação):</label>
                <input type="number" id="inputMint" placeholder="Ex: 1000">
            </div>
            <button onclick="doMint()" class="btn-success">Realizar Mint</button>
        </div>
    </div>

    <div id="log" class="log">Aguardando conexão...</div>
</div>

<script>
    const contractAddress = "0x1a14f3ca35d1802060dbae326fbe0b0273471b76";
    const abi = [
        "function getStatus() public view returns (uint256 taxa, bool ativa, address dono, uint256 saldoDono)",
        "function setTaxaAtiva(bool _ativa) public",
        "function setTaxaPercentual(uint256 _novaTaxa) public",
        "function autorizarPool(address _pool, bool _autorizado) public",
        "function mint(uint256 quantidade) public",
        "function balanceOf(address) public view returns (uint256)",
        "function owner() public view returns (address)"
    ];

    let provider, signer, contract;

    async function init() {
        if (typeof window.ethereum !== 'undefined') {
            provider = new ethers.providers.Web3Provider(window.ethereum);
            document.getElementById('connectBtn').addEventListener('click', connectWallet);
            addLog("Pronto para conectar.");
        } else {
            addLog("MetaMask não detectada!");
        }
    }

    async function connectWallet() {
        try {
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            const address = await signer.getAddress();
            contract = new ethers.Contract(contractAddress, abi, signer);
            
            document.getElementById('connectBtn').innerText = "Conectado: " + address.substring(0,6) + "...";
            document.getElementById('adminPanel').style.display = 'block';
            addLog("Carteira conectada: " + address);
            refreshData();
        } catch (err) {
            addLog("Erro ao conectar: " + err.message);
        }
    }

    async function refreshData() {
        try {
            const status = await contract.getStatus();
            document.getElementById('valTaxa').innerText = status.taxa.toString();
            document.getElementById('valStatus').innerText = status.ativa ? "LIGADA" : "DESLIGADA";
            document.getElementById('valOwner').innerText = status.dono;
            
            const saldo = await contract.balanceOf(await signer.getAddress());
            document.getElementById('valSaldo').innerText = ethers.utils.formatEther(saldo);
            
            addLog("Dados atualizados.");
        } catch (err) {
            addLog("Erro ao buscar dados: " + err.message);
        }
    }

    async function updateTaxa() {
        const novaTaxa = document.getElementById('inputTaxa').value;
        if (!novaTaxa) return alert("Insira um valor");
        try {
            addLog("Enviando transação: setTaxaPercentual...");
            const tx = await contract.setTaxaPercentual(novaTaxa);
            addLog("TX enviada: " + tx.hash);
            await tx.wait();
            addLog("Sucesso!");
            refreshData();
        } catch (err) {
            addLog("Erro: " + err.message);
        }
    }

    async function updateStatus() {
        const ativa = document.getElementById('selectStatus').value === "true";
        try {
            addLog("Enviando transação: setTaxaAtiva...");
            const tx = await contract.setTaxaAtiva(ativa);
            addLog("TX enviada: " + tx.hash);
            await tx.wait();
            addLog("Sucesso!");
            refreshData();
        } catch (err) {
            addLog("Erro: " + err.message);
        }
    }

    async function updatePool() {
        const pool = document.getElementById('inputPool').value;
        const autorizado = document.getElementById('selectPoolAction').value === "true";
        if (!ethers.utils.isAddress(pool)) return alert("Endereço inválido");
        try {
            addLog("Enviando transação: autorizarPool...");
            const tx = await contract.autorizarPool(pool, autorizado);
            addLog("TX enviada: " + tx.hash);
            await tx.wait();
            addLog("Sucesso!");
            refreshData();
        } catch (err) {
            addLog("Erro: " + err.message);
        }
    }

    async function doMint() {
        const qtd = document.getElementById('inputMint').value;
        if (!qtd) return alert("Insira uma quantidade");
        try {
            addLog("Enviando transação: mint...");
            const tx = await contract.mint(qtd);
            addLog("TX enviada: " + tx.hash);
            await tx.wait();
            addLog("Sucesso!");
            refreshData();
        } catch (err) {
            addLog("Erro: " + err.message);
        }
    }

    function addLog(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    init();
</script>

</body>
</html>
